[project]
name = "todo-project"
version = "0.1.0"
description = "命令行待办事项应用"
authors = [
    {name = "shenmin-gu",email = "gushenmin2021@163.com"}
]
license = "MIT"
requires-python = "^3.14"
dependencies = [
    "ast-serialize (==0.7.0)",
    "cfgv (==3.5.0)",
    "distlib (==0.4.3)",
    "filelock (==3.32.2)",
    "gmssl (==3.2.2)",
    "identify (==2.6.19)",
    "librt (==0.14.0)",
    "mypy (==2.3.0)",
    "mypy-extensions (==1.1.0)",
    "nodeenv (==1.10.0)",
    "pathspec (==1.1.1)",
    "platformdirs (==4.11.0)",
    "pre-commit (==4.6.1)",
    "pycryptodomex (==3.23.0)",
    "python-discovery (==1.5.1)",
    "pyyaml (==6.0.3)",
    "typing-extensions (==4.16.0)",
    "virtualenv (==21.7.1)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)"
]

[tool.isort]
profile = "black"
