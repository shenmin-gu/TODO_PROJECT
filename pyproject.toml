[project]
name = "todo-project"
version = "0.1.0"
description = "命令行待办事项应用"
authors = [
    {name = "shenmin-gu",email = "gushenmin2021@163.com"}
]
license = "MIT"
requires-python = "^3.11"
dependencies = [
    "python-dotenv (>=1.2.3,<2.0.0)"
]

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "mypy (>=2.3.1,<3.0.0)",
    "pre-commit (>=4.6.2,<5.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "isort (>=8.0.1,<9.0.0)",
]

[tool.isort]
profile = "black"
